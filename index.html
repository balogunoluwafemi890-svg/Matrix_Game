<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Checkers</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>
  <div class="toast-container" id="toasts"></div>
  <div class="confetti-container" id="confetti"></div>

  <div id="app">

    <!-- INTRO SCREEN -->
    <div id="introScreen" class="screen active">
      <div class="intro-screen">
        <div class="intro-board" id="introBoard"></div>
        <h1 class="font-display text-5xl md:text-7xl font-black tracking-tight mb-4">Matrix Checkers</h1>
        <p class="text-lg md:text-xl mb-8" style="color:var(--muted);max-width:440px">
          Master matrices step-by-step through an interactive checkerboard.
          Seven levels from coordinates to battle.
        </p>
        <div class="intro-buttons">
          <button id="startBtn" class="btn-primary btn-lg">
            <i class="fa-solid fa-play mr-2"></i>Start Learning
          </button>
          <button id="introLeaderboardBtn" class="btn-ghost btn-lg">
            <i class="fa-solid fa-trophy mr-2"></i>Leaderboard
          </button>
        </div>
        <div id="loggedInAs" class="logged-in-badge" style="display:none">
          <i class="fa-solid fa-user"></i> <span id="loggedInName"></span>
        </div>
      </div>
    </div>

  </div>

  <script src="util.js"></script>
  <script src="firebase.js"></script>
  <script src="sound.js"></script>
  <script src="engine.js"></script>
  <script src="auth.js"></script>
  <script src="leaderboard.js"></script>
  <script src="index.js"></script>
</body>
</html>
